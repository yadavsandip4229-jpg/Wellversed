<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 15px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 14px; color: #555; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { width: 100%; background-color: #25D366; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1ebc57; }
    </style>
</head>
<body>

<div class="card">
    <h2>🛍️ Order Form</h2>
    <form id="orderForm">
        <div class="form-group">
            <label>Aapka Naam:</label>
            <input type="text" id="name" placeholder="Pura naam likhein" required>
        </div>

        <div class="form-group">
            <label>Product Chunien:</label>
            <select id="product">
                <option value="Product A - ₹499">Product A - ₹499</option>
                <option value="Product B - ₹999">Product B - ₹999</option>
            </select>
        </div>

        <div class="form-group">
            <label>Pura Pata (Address):</label>
            <textarea id="address" rows="3" placeholder="Ghar ka pata aur Pincode" required></textarea>
        </div>

        <!-- YAHAN APNA WHATSAPP NUMBER BADLEIN (Country Code 91 ke saath) -->
        <button type="button" onclick="sendOrder()">WhatsApp Par Order Karein</button>
    </form>
</div>

<script>
function sendOrder() {
    // ⚠️ APNA WHATSAPP NUMBER YAHAN DALEIN (Jaise: 919876543210)
    var phoneNumber = "91XXXXXXXXXX"; 

    var name = document.getElementById("name").value;
    var product = document.getElementById("product").value;
    var address = document.getElementById("address").value;

    if(name == "" || address == "") {
        alert("Kripya saari jankari bharein!");
        return;
    }

    var message = "Hello! Mujhe Naya Order Dena Hai:%0A%0A" +
                  "*Naam:* " + encodeURIComponent(name) + "%0A" +
                  "*Item:* " + encodeURIComponent(product) + "%0A" +
                  "*Pata:* " + encodeURIComponent(address);

    var whatsappUrl = "https://wa.me/" + phoneNumber + "?text=" + message;
    
    // PC aur Mobile dono par chalega
    window.open(whatsappUrl, '_blank');
}
</script>

</body>
</html>
